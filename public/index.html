<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelSquid 3D 오브젝트 생성기 - Flux AI</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif;
            background: linear-gradient(135deg, #0a0e1a 0%, #1a1f35 100%);
            color: #ffffff;
            min-height: 100vh;
            padding: 20px;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 0;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: linear-gradient(135deg, #1e2842 0%, #141b2e 100%);
            border-radius: 24px;
            padding: 32px 40px;
            margin-bottom: 40px;
            border: 1px solid rgba(0, 212, 255, 0.2);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 40px;
        }

        .header-left {
            flex: 0 0 auto;
        }

        .header-right {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            max-width: 700px;
        }

        h1 {
            font-size: 36px;
            font-weight: 600;
            background: linear-gradient(135deg, #00ffff, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            white-space: nowrap;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 14px;
            max-width: 400px;
        }

        .success-badge {
            display: inline-block;
            margin-left: 16px;
            font-size: 16px;
            padding: 4px 12px;
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid rgba(16, 185, 129, 0.4);
            border-radius: 8px;
            color: #10b981;
            font-weight: 600;
        }

        .api-key-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .api-key-label {
            font-size: 12px;
            font-weight: 600;
            color: #ffffff;
        }

        .api-key-input {
            width: 100%;
            padding: 10px 12px;
            background: #0a0e1a;
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 8px;
            color: #ffffff;
            font-family: inherit;
            font-size: 13px;
            transition: all 0.3s ease;
        }

        .api-key-input:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.2);
        }

        .api-key-hint {
            font-size: 10px;
            color: #64748b;
        }

        .api-key-hint a {
            color: #00ffff;
            text-decoration: none;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        .panel {
            background: rgba(30, 40, 66, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 32px;
            border: 1px solid rgba(0, 212, 255, 0.2);
        }

        .panel-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .panel-title::before {
            content: '';
            width: 4px;
            height: 24px;
            background: linear-gradient(180deg, #00ffff, #00d4ff);
            border-radius: 2px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            background: #0a0e1a;
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 8px;
            color: #ffffff;
            font-family: inherit;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.2);
        }

        /* Resolution selector styles */
        .resolution-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .resolution-btn {
            flex: 1;
            min-width: 100px;
            padding: 12px 16px;
            background: #0a0e1a;
            border: 2px solid rgba(0, 212, 255, 0.3);
            border-radius: 8px;
            color: #94a3b8;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .resolution-btn:hover {
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.05);
            color: #ffffff;
        }

        .resolution-btn.active {
            background: linear-gradient(135deg, #00ffff, #00d4ff);
            border-color: #00d4ff;
            color: #0a0e1a;
        }

        .resolution-btn.disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: rgba(148, 163, 184, 0.15);
        }

        .resolution-btn.disabled:hover {
            border-color: rgba(148, 163, 184, 0.15);
            background: #0a0e1a;
            color: #94a3b8;
        }

        .resolution-label {
            display: block;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .resolution-details {
            font-size: 11px;
            opacity: 0.8;
        }

        .button-group {
            display: flex;
            gap: 16px;
        }

        .btn-primary, .btn-secondary {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-family: inherit;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00ffff, #00d4ff);
            color: #0a0e1a;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: rgba(0, 212, 255, 0.1);
            color: #00ffff;
            border: 1px solid rgba(0, 212, 255, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(0, 212, 255, 0.2);
        }

        .cube-container {
            width: 250px;
            height: 250px;
            margin: 0 auto 16px;
            background: #0a0e1a;
            border-radius: 12px;
            border: 1px solid rgba(0, 212, 255, 0.2);
        }

        .cube-legend {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 24px;
            padding: 16px;
            background: rgba(0, 212, 255, 0.05);
            border-radius: 8px;
            border: 1px solid rgba(0, 212, 255, 0.15);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #94a3b8;
        }

        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .color-front { background: #00ffff; }
        .color-top { background: #10b981; }
        .color-right { background: #3b82f6; }
        .color-left { background: #8b5cf6; }
        .color-bottom { background: #6b7280; }
        .color-back { background: #1e293b; }

        .reset-button-container {
            margin-bottom: 24px;
        }

        .btn-reset {
            width: 100%;
            padding: 12px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            color: #ef4444;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-reset:hover {
            background: rgba(239, 68, 68, 0.2);
            border-color: #ef4444;
        }

        .preset-angles-container {
            margin-bottom: 24px;
        }

        .preset-angles-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .preset-angle-btn {
            padding: 10px 8px;
            background: #0a0e1a;
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 6px;
            color: #94a3b8;
            font-family: inherit;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .preset-angle-btn:hover {
            background: rgba(0, 212, 255, 0.1);
            border-color: #00d4ff;
            color: #00d4ff;
        }

        .angle-display {
            display: flex;
            justify-content: space-around;
            margin-bottom: 24px;
            padding: 16px;
            background: #0a0e1a;
            border-radius: 8px;
        }

        .angle-value {
            text-align: center;
        }

        .angle-label {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 4px;
        }

        .angle-number {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #00ffff, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .camera-description {
            text-align: center;
            font-size: 14px;
            color: #00ffff;
            margin-bottom: 24px;
            padding: 12px;
            background: rgba(0, 212, 255, 0.1);
            border-radius: 8px;
            border: 1px solid rgba(0, 212, 255, 0.2);
        }

        .result-panel {
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0e1a;
            border-radius: 12px;
            padding: 32px;
        }

        .result-image {
            max-width: 100%;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .transparency-badge {
            margin-top: 16px;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            display: inline-block;
        }

        .transparency-badge.yes {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #10b981;
        }

        .transparency-badge.no {
            background: rgba(251, 191, 36, 0.2);
            border: 1px solid rgba(251, 191, 36, 0.4);
            color: #fbbf24;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(0, 212, 255, 0.2);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            padding: 20px;
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.4);
            border-radius: 8px;
            color: #ef4444;
        }

        .warning-message {
            margin-top: 12px;
            padding: 12px;
            background: rgba(251, 191, 36, 0.2);
            border: 1px solid rgba(251, 191, 36, 0.4);
            border-radius: 8px;
            color: #fbbf24;
            font-size: 13px;
        }

        .info-box {
            padding: 16px;
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 8px;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function PixelSquidGenerator() {
            const [replicateApiKey, setReplicateApiKey] = useState(localStorage.getItem('replicateApiKey') || '');
            const [objectName, setObjectName] = useState('');
            const [rotationX, setRotationX] = useState(0.5);
            const [rotationY, setRotationY] = useState(0.5);
            const [loading, setLoading] = useState(false);
            const [generatedImage, setGeneratedImage] = useState(null);
            const [hasTransparency, setHasTransparency] = useState(false);
            const [error, setError] = useState(null);
            const [warning, setWarning] = useState(null);
            const [resolution, setResolution] = useState('1024x1024'); // Default 1K
            const [model, setModel] = useState('flux-schnell'); // Default FLUX Schnell
            
            const cubeRef = useRef(null);
            const sceneRef = useRef(null);
            const cameraRef = useRef(null);
            const rendererRef = useRef(null);
            const cubeObjectRef = useRef(null);
            const rotationXRef = useRef(0.5);
            const rotationYRef = useRef(0.5);

            // Auto-adjust resolution when model changes
            useEffect(() => {
                const currentModel = modelOptions.find(m => m.value === model);
                if (!currentModel) return;
                
                const [currentWidth] = resolution.split('x').map(Number);
                const [maxWidth] = currentModel.maxRes.split('x').map(Number);
                
                if (currentWidth > maxWidth) {
                    // Auto-adjust to max supported resolution
                    setResolution(currentModel.maxRes);
                    console.log(`Auto-adjusted resolution from ${resolution} to ${currentModel.maxRes} for ${model}`);
                }
            }, [model]);

            // Resolution options
            const resolutionOptions = [
                { value: '1024x1024', label: '1K', details: '1024×1024', allModels: true },
                { value: '1440x1440', label: '1.5K', details: '1440×1440', allModels: true },
                { value: '2048x2048', label: '2K', details: '2048×2048', excludeModels: ['flux-pro', 'flux-schnell', 'sdxl'] },
                { value: '2560x2560', label: '2.5K', details: '2560×2560', excludeModels: ['flux-pro', 'flux-schnell', 'sdxl'] }
            ];

            // Model options with max resolution info
            const modelOptions = [
                { value: 'flux-schnell', label: 'FLUX Schnell', details: '빠름, 1K 전용', cost: '$', maxRes: '1024x1024' },
                { value: 'flux-pro', label: 'FLUX Pro', details: '최고 품질, 최대 1.5K', cost: '$$', maxRes: '1440x1440' },
                { value: 'imagen-3', label: 'Imagen-3', details: 'Google 최고급, 2K+', cost: '$$', maxRes: '2560x2560' },
                { value: 'nano-banana', label: 'Nano Banana', details: 'Google 편집 모델, 2K+', cost: '$$', maxRes: '2560x2560' },
                { value: 'sdxl', label: 'SDXL', details: '안정적, 1K 전용', cost: '$', maxRes: '1024x1024' },
                { value: 'recraft', label: 'Recraft V3', details: '리얼리스틱, 최대 2K', cost: '$', maxRes: '2048x2048' }
            ];

            // Save API key
            useEffect(() => {
                if (replicateApiKey) localStorage.setItem('replicateApiKey', replicateApiKey);
            }, [replicateApiKey]);

            // Update rotation refs
            useEffect(() => {
                rotationXRef.current = rotationX;
                rotationYRef.current = rotationY;
            }, [rotationX, rotationY]);

            // Initialize Three.js scene
            useEffect(() => {
                if (!cubeRef.current) return;

                const scene = new THREE.Scene();
                const camera = new THREE.PerspectiveCamera(75, 1, 0.1, 1000);
                const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                
                renderer.setSize(250, 250);
                renderer.setClearColor(0x0a0e1a, 1);
                cubeRef.current.appendChild(renderer.domElement);

                // Create cube with colored faces
                const geometry = new THREE.BoxGeometry(2, 2, 2);
                
                // Define materials for each face with different colors
                // Order: Right, Left, Top, Bottom, Front, Back
                const materials = [
                    new THREE.MeshBasicMaterial({ color: 0x3b82f6, opacity: 0.6, transparent: true }), // Right - Blue
                    new THREE.MeshBasicMaterial({ color: 0x8b5cf6, opacity: 0.6, transparent: true }), // Left - Purple
                    new THREE.MeshBasicMaterial({ color: 0x10b981, opacity: 0.6, transparent: true }), // Top - Green
                    new THREE.MeshBasicMaterial({ color: 0x6b7280, opacity: 0.4, transparent: true }), // Bottom - Gray
                    new THREE.MeshBasicMaterial({ color: 0x00ffff, opacity: 0.7, transparent: true }), // Front - Cyan (Brightest)
                    new THREE.MeshBasicMaterial({ color: 0x1e293b, opacity: 0.5, transparent: true })  // Back - Dark
                ];
                
                const cube = new THREE.Mesh(geometry, materials);
                
                // Add wireframe edges
                const edges = new THREE.EdgesGeometry(geometry);
                const lineMaterial = new THREE.LineBasicMaterial({ color: 0x00d4ff, linewidth: 2 });
                const wireframe = new THREE.LineSegments(edges, lineMaterial);
                cube.add(wireframe);
                
                scene.add(cube);
                camera.position.z = 5;

                sceneRef.current = scene;
                cameraRef.current = camera;
                rendererRef.current = renderer;
                cubeObjectRef.current = cube;

                const animate = () => {
                    requestAnimationFrame(animate);
                    // Use refs to get current rotation values
                    cube.rotation.x = rotationXRef.current;
                    cube.rotation.y = rotationYRef.current;
                    renderer.render(scene, camera);
                };
                animate();

                return () => {
                    renderer.dispose();
                    cubeRef.current?.removeChild(renderer.domElement);
                };
            }, []);

            // Update cube rotation (backup method)
            useEffect(() => {
                if (cubeObjectRef.current) {
                    cubeObjectRef.current.rotation.x = rotationX;
                    cubeObjectRef.current.rotation.y = rotationY;
                }
            }, [rotationX, rotationY]);

            const getCameraAngle = () => {
                const xDeg = Math.round((rotationX * 180 / Math.PI) % 360);
                const yDeg = Math.round((rotationY * 180 / Math.PI) % 360);
                
                // Normalize angles to 0-360
                const normalizedX = ((xDeg % 360) + 360) % 360;
                let normalizedY = ((yDeg % 360) + 360) % 360;
                
                // CRITICAL FIX: Invert Y rotation to match cube visibility
                // When cube shows RIGHT side (Y=29°), we need to generate showing RIGHT side
                // Standard Three.js +Y rotation shows left, so we invert
                normalizedY = (360 - normalizedY) % 360;
                
                // Helper function to check if angle is within range
                const inRange = (angle, target, tolerance = 25) => {
                    return Math.abs(angle - target) < tolerance || 
                           Math.abs(angle - target + 360) < tolerance ||
                           Math.abs(angle - target - 360) < tolerance;
                };
                
                // FRONT VIEW
                if (inRange(normalizedX, 0, 15) && inRange(normalizedY, 0, 15)) 
                    return { display: "정면 (Front)", prompt: "front view of object, object facing directly toward camera, centered composition" };
                
                // RIGHT SIDE VIEW - Object's right side facing camera
                if (inRange(normalizedX, 0, 15) && inRange(normalizedY, 90, 15)) 
                    return { display: "우측면 (Right)", prompt: "right side view of object, showing the object's right side, 90 degree side profile" };
                
                // BACK VIEW
                if (inRange(normalizedX, 0, 15) && (inRange(normalizedY, 180, 15) || inRange(normalizedY, -180, 15))) 
                    return { display: "후면 (Back)", prompt: "back view of object, object's rear side facing camera" };
                
                // LEFT SIDE VIEW
                if (inRange(normalizedX, 0, 15) && (inRange(normalizedY, 270, 15) || inRange(normalizedY, -90, 15))) 
                    return { display: "좌측면 (Left)", prompt: "left side view of object, showing the object's left side, 90 degree side profile" };
                
                // TOP VIEW
                if (inRange(normalizedX, 90, 15)) 
                    return { display: "상단 (Top)", prompt: "top view of object, bird's eye perspective looking down at the object from directly above" };
                
                // BOTTOM VIEW
                if (inRange(normalizedX, 270, 15) || inRange(normalizedX, -90, 15)) 
                    return { display: "하단 (Bottom)", prompt: "bottom view of object, looking up at the underside of the object" };
                
                // THREE-QUARTER VIEWS
                
                // Front-Right 3/4 - Shows front and right sides (Y around 20-70 after inversion = original -20 to -70)
                if (normalizedX > 20 && normalizedX < 60 && normalizedY > 290 && normalizedY < 350) 
                    return { display: "우상단 3/4 (Front-Right 3/4)", prompt: "three-quarter angle showing both the front and right side of the object, object rotated to prominently display its right side along with the front, elevated camera angle" };
                
                // Front-Left 3/4 - Shows front and left sides  
                if (normalizedX > 20 && normalizedX < 60 && normalizedY > 10 && normalizedY < 70) 
                    return { display: "좌상단 3/4 (Front-Left 3/4)", prompt: "three-quarter angle showing both the front and left side of the object, object rotated to prominently display its left side along with the front, elevated camera angle" };
                
                // Back-Right 3/4
                if (normalizedX > 20 && normalizedX < 60 && normalizedY > 200 && normalizedY < 250) 
                    return { display: "후우측 3/4 (Back-Right 3/4)", prompt: "three-quarter rear angle showing the back and right side of the object" };
                
                // Back-Left 3/4
                if (normalizedX > 20 && normalizedX < 60 && normalizedY > 110 && normalizedY < 160) 
                    return { display: "후좌측 3/4 (Back-Left 3/4)", prompt: "three-quarter rear angle showing the back and left side of the object" };
                
                // ISOMETRIC VIEWS
                
                // Isometric Front-Right
                if (normalizedX > 30 && normalizedX < 50 && normalizedY > 305 && normalizedY < 345)
                    return { display: "아이소메트릭 우전 (Iso Front-Right)", prompt: "isometric view showing front and right side of object at 35 degree angle, technical drawing perspective" };
                
                // Isometric Front-Left
                if (normalizedX > 30 && normalizedX < 50 && normalizedY > 15 && normalizedY < 55)
                    return { display: "아이소메트릭 좌전 (Iso Front-Left)", prompt: "isometric view showing front and left side of object at 35 degree angle, technical drawing perspective" };
                
                // HIGH ANGLE views
                if (normalizedX > 60 && normalizedX < 90) {
                    if (normalizedY < 45 || normalizedY > 315) return { display: "고각도 정면 (High Front)", prompt: "high angle view from above showing mostly the front of the object, camera elevated 60-70 degrees" };
                    if (normalizedY > 45 && normalizedY < 135) return { display: "고각도 좌측 (High Left)", prompt: "high angle view showing the object's left side from above, camera elevated 60-70 degrees" };
                    if (normalizedY > 135 && normalizedY < 225) return { display: "고각도 후면 (High Back)", prompt: "high angle view showing the object's back from above, camera elevated 60-70 degrees" };
                    return { display: "고각도 우측 (High Right)", prompt: "high angle view showing the object's right side from above, camera elevated 60-70 degrees" };
                }
                
                // GENERAL ANGLED VIEW (fallback)
                const elevationDesc = normalizedX < 15 ? "eye level" : 
                                     normalizedX < 45 ? "slightly elevated" :
                                     normalizedX < 75 ? "elevated angle" : "high angle";
                                     
                // After inversion: low normalizedY = right side, high = left side
                const sideDesc = normalizedY < 30 || normalizedY > 330 ? "front of object facing camera" :
                                normalizedY > 300 && normalizedY <= 330 ? "front and right side of object visible" :
                                normalizedY > 260 && normalizedY <= 300 ? "right side of object prominently visible" :
                                normalizedY > 190 && normalizedY <= 260 ? "right side and back of object visible" :
                                normalizedY > 170 && normalizedY <= 190 ? "back of object facing camera" :
                                normalizedY > 100 && normalizedY <= 170 ? "back and left side of object visible" :
                                normalizedY > 80 && normalizedY <= 100 ? "left side of object prominently visible" :
                                normalizedY > 30 && normalizedY <= 80 ? "left side and front of object visible" : "front of object facing camera";
                
                return { 
                    display: `각진 뷰 (${elevationDesc})`, 
                    prompt: `${elevationDesc} view with ${sideDesc}, professional product photography` 
                };
            };

            const cameraAngleData = getCameraAngle();
            const cameraAngle = cameraAngleData.display;

            const handleMouseDown = (e) => {
                const startX = e.clientX;
                const startY = e.clientY;
                const startRotX = rotationX;
                const startRotY = rotationY;

                const handleMouseMove = (e) => {
                    const deltaX = e.clientX - startX;
                    const deltaY = e.clientY - startY;
                    setRotationX(startRotX + deltaY * 0.01);
                    setRotationY(startRotY + deltaX * 0.01);
                };

                const handleMouseUp = () => {
                    document.removeEventListener('mousemove', handleMouseMove);
                    document.removeEventListener('mouseup', handleMouseUp);
                };

                document.addEventListener('mousemove', handleMouseMove);
                document.addEventListener('mouseup', handleMouseUp);
            };

            const resetAngle = () => {
                setRotationX(0.5);
                setRotationY(0.5);
            };

            const setPresetAngle = (x, y) => {
                setRotationX(x);
                setRotationY(y);
            };

            const handleGenerate = async () => {
                if (!replicateApiKey || !objectName) return;

                setLoading(true);
                setError(null);
                setWarning(null);
                setGeneratedImage(null);

                const cameraDesc = cameraAngleData.prompt;
                
                // ALWAYS use colored background for reliable background removal
                // But ensure object has white/neutral lighting (not blue reflections)
                const backgroundDesc = "vibrant solid blue background (#0066FF), clean studio background, uniform blue color";
                const lightingDesc = "professional white studio lighting, neutral white light, soft white reflections on object, no colored light spill, pure white key light and fill light";

                const prompt = `Professional 3D render of a ${objectName}. 
Camera: ${cameraDesc}.
Background: ${backgroundDesc}.
Lighting: ${lightingDesc}. The object should be lit with pure white light sources only, with natural colors and white highlights. The blue background should NOT cast any blue light or reflections onto the object.
Style: Ultra-realistic 3D product render with clean professional studio lighting, high detail and quality, photorealistic materials and textures, accurate object colors without color contamination from background.
Composition: Center the object in frame with proper composition and depth. The object should be clearly separated from the blue background with proper edge definition.
Quality: Sharp details, professional product photography quality, true-to-life colors.`;

                try {
                    const response = await fetch('/api/generate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            replicateApiKey,
                            prompt,
                            resolution,
                            model
                        })
                    });

                    const data = await response.json();

                    if (data.error) {
                        setError(data.error.message);
                    } else {
                        setGeneratedImage(`data:image/png;base64,${data.image}`);
                        setHasTransparency(data.hasTransparency);
                        setWarning(data.warning);
                    }
                } catch (err) {
                    setError(`생성 실패: ${err.message}`);
                } finally {
                    setLoading(false);
                }
            };

            const downloadImage = () => {
                if (!generatedImage) return;
                const link = document.createElement('a');
                link.href = generatedImage;
                link.download = `${objectName}-${cameraAngle}-${resolution}.png`;
                link.click();
            };

            return (
                <div className="container">
                    <div className="header">
                        <div className="header-left">
                            <h1>PixelSquid 3D 오브젝트 생성기
                                <span className="success-badge">Flux AI</span>
                            </h1>
                            <p className="subtitle">
                                Flux AI로 고품질 3D 오브젝트 생성 + 자동 배경 제거
                            </p>
                        </div>
                        <div className="header-right">
                            <div className="api-key-group" style={{gridColumn: '1 / -1'}}>
                                <label className="api-key-label">Replicate API Key</label>
                                <input
                                    type="password"
                                    className="api-key-input"
                                    value={replicateApiKey}
                                    onChange={(e) => setReplicateApiKey(e.target.value)}
                                    placeholder="Replicate API 키 입력"
                                />
                                <div className="api-key-hint">
                                    <a href="https://replicate.com/account/api-tokens" target="_blank">API 키 발급받기</a>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="content">
                        {/* Left Panel */}
                        <div className="panel">
                            <h2 className="panel-title">이미지 설정</h2>
                            
                            {/* Object Name Input - MOVED TO TOP */}
                            <div className="form-group">
                                <label htmlFor="objectInput">🎯 오브젝트 이름 (한글/영어)</label>
                                <input 
                                    type="text" 
                                    id="objectInput"
                                    value={objectName}
                                    onChange={(e) => setObjectName(e.target.value)}
                                    placeholder="예: 커피잔, coffee mug, 노트북, laptop"
                                />
                            </div>

                            {/* Generate Button - MOVED TO TOP */}
                            <div className="form-group">
                                <button 
                                    className="btn-primary" 
                                    onClick={handleGenerate}
                                    disabled={loading || !objectName || !replicateApiKey}
                                    style={{ width: '100%' }}
                                >
                                    {loading ? '생성 중...' : '🎨 이미지 생성'}
                                </button>
                            </div>

                            <hr style={{
                                border: 'none',
                                borderTop: '1px solid rgba(0, 212, 255, 0.2)',
                                margin: '24px 0'
                            }} />
                            
                            {/* Camera Angle Controls */}
                            <div 
                                ref={cubeRef} 
                                className="cube-container"
                                onMouseDown={handleMouseDown}
                                style={{ cursor: 'grab' }}
                            />

                            <div className="cube-legend">
                                <div className="legend-item">
                                    <div className="legend-color color-front"></div>
                                    <span>앞면 (Front)</span>
                                </div>
                                <div className="legend-item">
                                    <div className="legend-color color-top"></div>
                                    <span>위 (Top)</span>
                                </div>
                                <div className="legend-item">
                                    <div className="legend-color color-right"></div>
                                    <span>우측 (Right)</span>
                                </div>
                                <div className="legend-item">
                                    <div className="legend-color color-left"></div>
                                    <span>좌측 (Left)</span>
                                </div>
                                <div className="legend-item">
                                    <div className="legend-color color-bottom"></div>
                                    <span>아래 (Bottom)</span>
                                </div>
                                <div className="legend-item">
                                    <div className="legend-color color-back"></div>
                                    <span>뒤 (Back)</span>
                                </div>
                            </div>

                            <div className="reset-button-container">
                                <button className="btn-reset" onClick={resetAngle}>
                                    🔄 큐브 각도 리셋
                                </button>
                            </div>

                            <div className="preset-angles-container">
                                <label style={{marginBottom: '12px', display: 'block', fontSize: '13px', color: '#94a3b8'}}>
                                    📐 빠른 각도 선택
                                </label>
                                <div className="preset-angles-grid">
                                    <button className="preset-angle-btn" onClick={() => setPresetAngle(0, 0)}>
                                        정면
                                    </button>
                                    <button className="preset-angle-btn" onClick={() => setPresetAngle(0, Math.PI/2)}>
                                        우측
                                    </button>
                                    <button className="preset-angle-btn" onClick={() => setPresetAngle(0, Math.PI)}>
                                        후면
                                    </button>
                                    <button className="preset-angle-btn" onClick={() => setPresetAngle(0.5, 0.5)}>
                                        3/4 우상
                                    </button>
                                    <button className="preset-angle-btn" onClick={() => setPresetAngle(Math.PI/2, 0)}>
                                        상단
                                    </button>
                                    <button className="preset-angle-btn" onClick={() => setPresetAngle(0.5, -0.5)}>
                                        3/4 좌상
                                    </button>
                                </div>
                            </div>

                            <div className="angle-display">
                                <div className="angle-value">
                                    <div className="angle-label">X Rotation</div>
                                    <div className="angle-number">{Math.round((rotationX * 180 / Math.PI) % 360)}°</div>
                                </div>
                                <div className="angle-value">
                                    <div className="angle-label">Y Rotation</div>
                                    <div className="angle-number">{Math.round((rotationY * 180 / Math.PI) % 360)}°</div>
                                </div>
                            </div>

                            <div className="camera-description">📷 {cameraAngle}</div>

                            <div className="form-group">
                                <label>📐 이미지 해상도</label>
                                <div className="resolution-group">
                                    {resolutionOptions.map(option => {
                                        const currentModel = modelOptions.find(m => m.value === model);
                                        const [optionWidth] = option.value.split('x').map(Number);
                                        const [maxWidth] = currentModel.maxRes.split('x').map(Number);
                                        const isDisabled = optionWidth > maxWidth;
                                        
                                        return (
                                            <button
                                                key={option.value}
                                                className={`resolution-btn ${resolution === option.value ? 'active' : ''} ${isDisabled ? 'disabled' : ''}`}
                                                onClick={() => !isDisabled && setResolution(option.value)}
                                                disabled={isDisabled}
                                                title={isDisabled ? `${currentModel.label}는 최대 ${currentModel.maxRes} 지원` : option.details}
                                            >
                                                <div className="resolution-label">{option.label}</div>
                                                <div className="resolution-details">{option.details}</div>
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>

                            <div className="form-group">
                                <label>🤖 AI 모델 선택</label>
                                <div className="resolution-group">
                                    {modelOptions.map(option => (
                                        <button
                                            key={option.value}
                                            className={`resolution-btn ${model === option.value ? 'active' : ''}`}
                                            onClick={() => setModel(option.value)}
                                            title={option.details}
                                        >
                                            <div className="resolution-label">{option.label}</div>
                                            <div className="resolution-details">{option.cost}</div>
                                        </button>
                                    ))}
                                </div>
                                <div className="info-box" style={{marginTop: '12px', fontSize: '12px'}}>
                                    <strong>💡 모델 안내:</strong><br/>
                                    • FLUX Schnell: 가장 빠름, 1K만 지원 (기본값)<br/>
                                    • FLUX Pro: 고품질, 최대 1.5K (1440x1440)<br/>
                                    • Imagen-3: Google 최고급, 2K+ 지원<br/>
                                    • Nano Banana: Google 편집 모델, 2K+ 지원<br/>
                                    • SDXL: 안정적, 1K만 지원<br/>
                                    • Recraft V3: 리얼리스틱, 최대 2K 지원
                                </div>
                            </div>

                        </div>

                        {/* Right Panel */}
                        <div className="panel">
                            <h2 className="panel-title">생성 결과</h2>
                            
                            <div className="result-panel">
                                {loading && (
                                    <div style={{ textAlign: 'center' }}>
                                        <div className="loading-spinner"></div>
                                        <p style={{ color: '#94a3b8' }}>
                                            {model === 'flux-schnell' && 'FLUX Schnell로 빠르게 이미지를 생성하고 배경을 제거하고 있습니다...'}
                                            {model === 'flux-pro' && 'FLUX Pro로 고해상도 이미지를 생성하고 배경을 제거하고 있습니다...'}
                                            {model === 'imagen-3' && 'Google Imagen-3로 최고급 이미지를 생성하고 배경을 제거하고 있습니다...'}
                                            {model === 'nano-banana' && 'Google Nano Banana로 이미지를 생성하고 배경을 제거하고 있습니다...'}
                                            {model === 'sdxl' && 'SDXL로 이미지를 생성하고 배경을 제거하고 있습니다...'}
                                            {model === 'recraft' && 'Recraft V3로 리얼리스틱 이미지를 생성하고 배경을 제거하고 있습니다...'}
                                        </p>
                                        <p style={{ fontSize: '12px', color: '#64748b', marginTop: '8px' }}>
                                            해상도: {resolution} (약 {model === 'flux-schnell' ? '5-15' : model === 'imagen-3' || model === 'nano-banana' ? '15-30' : '20-40'}초 소요)
                                        </p>
                                    </div>
                                )}

                                {error && !loading && (
                                    <div className="error-message">
                                        ❌ {error}
                                    </div>
                                )}

                                {generatedImage && !loading && (
                                    <div style={{ width: '100%', textAlign: 'center' }}>
                                        <img 
                                            src={generatedImage} 
                                            alt="Generated" 
                                            className="result-image"
                                        />
                                        <div className={`transparency-badge ${hasTransparency ? 'yes' : 'no'}`}>
                                            {hasTransparency ? '✅ 투명 배경 적용됨' : '⚠️ 배경 제거 대기 중'}
                                        </div>
                                        {warning && (
                                            <div className="warning-message">
                                                💡 {warning}
                                            </div>
                                        )}
                                        <button 
                                            className="btn-primary" 
                                            onClick={downloadImage}
                                            style={{ marginTop: '20px', width: '100%' }}
                                        >
                                            💾 PNG 다운로드 ({resolution})
                                        </button>
                                    </div>
                                )}

                                {!loading && !error && !generatedImage && (
                                    <div style={{ textAlign: 'center', color: '#64748b' }}>
                                        <div style={{ fontSize: '48px', marginBottom: '16px' }}>🎨</div>
                                        <p>왼쪽에서 각도와 해상도를 선택하고<br/>오브젝트 이름을 입력한 후<br/>생성 버튼을 눌러주세요</p>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<PixelSquidGenerator />, document.getElementById('root'));
    </script>
</body>
</html>
