<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelSquid 3D 오브젝트 생성기 - Flux AI</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif;
            background: linear-gradient(135deg, #0a0e1a 0%, #1a1f35 100%);
            color: #ffffff;
            min-height: 100vh;
            padding: 20px;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 0;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: linear-gradient(135deg, #1e2842 0%, #141b2e 100%);
            border-radius: 24px;
            padding: 32px 40px;
            margin-bottom: 40px;
            border: 1px solid rgba(0, 212, 255, 0.2);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 40px;
        }

        .header-left {
            flex: 0 0 auto;
        }

        .header-right {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            max-width: 700px;
        }

        h1 {
            font-size: 36px;
            font-weight: 600;
            background: linear-gradient(135deg, #00ffff, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            white-space: nowrap;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 14px;
            max-width: 400px;
        }

        .success-badge {
            display: inline-block;
            margin-left: 16px;
            font-size: 16px;
            padding: 4px 12px;
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid rgba(16, 185, 129, 0.4);
            border-radius: 8px;
            color: #10b981;
            font-weight: 600;
        }

        .api-key-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .api-key-label {
            font-size: 12px;
            font-weight: 600;
            color: #ffffff;
        }

        .api-key-input {
            width: 100%;
            padding: 10px 12px;
            background: #0a0e1a;
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 8px;
            color: #ffffff;
            font-family: inherit;
            font-size: 13px;
            transition: all 0.3s ease;
        }

        .api-key-input:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.2);
        }

        .api-key-hint {
            font-size: 10px;
            color: #64748b;
        }

        .api-key-hint a {
            color: #00ffff;
            text-decoration: none;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        .panel {
            background: rgba(30, 40, 66, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 32px;
            border: 1px solid rgba(0, 212, 255, 0.2);
        }

        .panel-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .panel-title::before {
            content: '';
            width: 4px;
            height: 24px;
            background: linear-gradient(180deg, #00ffff, #00d4ff);
            border-radius: 2px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            background: #0a0e1a;
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 8px;
            color: #ffffff;
            font-family: inherit;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.2);
        }

        /* Resolution selector styles */
        .resolution-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .resolution-btn {
            flex: 1;
            min-width: 100px;
            padding: 12px 16px;
            background: #0a0e1a;
            border: 2px solid rgba(0, 212, 255, 0.3);
            border-radius: 8px;
            color: #94a3b8;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .resolution-btn:hover {
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.05);
            color: #ffffff;
        }

        .resolution-btn.active {
            background: linear-gradient(135deg, #00ffff, #00d4ff);
            border-color: #00d4ff;
            color: #0a0e1a;
        }

        .resolution-label {
            display: block;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .resolution-details {
            font-size: 11px;
            opacity: 0.8;
        }

        .button-group {
            display: flex;
            gap: 16px;
        }

        .btn-primary, .btn-secondary {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-family: inherit;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00ffff, #00d4ff);
            color: #0a0e1a;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: rgba(0, 212, 255, 0.1);
            color: #00ffff;
            border: 1px solid rgba(0, 212, 255, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(0, 212, 255, 0.2);
        }

        .cube-container {
            width: 250px;
            height: 250px;
            margin: 0 auto 16px;
            background: #0a0e1a;
            border-radius: 12px;
            border: 1px solid rgba(0, 212, 255, 0.2);
        }

        .cube-legend {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 24px;
            padding: 16px;
            background: rgba(0, 212, 255, 0.05);
            border-radius: 8px;
            border: 1px solid rgba(0, 212, 255, 0.15);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #94a3b8;
        }

        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .color-front { background: #00ffff; }
        .color-top { background: #10b981; }
        .color-right { background: #3b82f6; }
        .color-left { background: #8b5cf6; }
        .color-bottom { background: #6b7280; }
        .color-back { background: #1e293b; }

        .reset-button-container {
            margin-bottom: 24px;
        }

        .btn-reset {
            width: 100%;
            padding: 12px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            color: #ef4444;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-reset:hover {
            background: rgba(239, 68, 68, 0.2);
            border-color: #ef4444;
        }

        .preset-angles-container {
            margin-bottom: 24px;
        }

        .preset-angles-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .preset-angle-btn {
            padding: 10px 8px;
            background: #0a0e1a;
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 6px;
            color: #94a3b8;
            font-family: inherit;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .preset-angle-btn:hover {
            background: rgba(0, 212, 255, 0.1);
            border-color: #00d4ff;
            color: #00d4ff;
        }

        .angle-display {
            display: flex;
            justify-content: space-around;
            margin-bottom: 24px;
            padding: 16px;
            background: #0a0e1a;
            border-radius: 8px;
        }

        .angle-value {
            text-align: center;
        }

        .angle-label {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 4px;
        }

        .angle-number {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #00ffff, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .camera-description {
            text-align: center;
            font-size: 14px;
            color: #00ffff;
            margin-bottom: 24px;
            padding: 12px;
            background: rgba(0, 212, 255, 0.1);
            border-radius: 8px;
            border: 1px solid rgba(0, 212, 255, 0.2);
        }

        .result-panel {
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0e1a;
            border-radius: 12px;
            padding: 32px;
        }

        .result-image {
            max-width: 100%;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .transparency-badge {
            margin-top: 16px;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            display: inline-block;
        }

        .transparency-badge.yes {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #10b981;
        }

        .transparency-badge.no {
            background: rgba(251, 191, 36, 0.2);
            border: 1px solid rgba(251, 191, 36, 0.4);
            color: #fbbf24;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(0, 212, 255, 0.2);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            padding: 20px;
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.4);
            border-radius: 8px;
            color: #ef4444;
        }

        .warning-message {
            margin-top: 12px;
            padding: 12px;
            background: rgba(251, 191, 36, 0.2);
            border: 1px solid rgba(251, 191, 36, 0.4);
            border-radius: 8px;
            color: #fbbf24;
            font-size: 13px;
        }

        .info-box {
            padding: 16px;
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 8px;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function PixelSquidGenerator() {
            const [replicateApiKey, setReplicateApiKey] = useState(localStorage.getItem('replicateApiKey') || '');
            const [objectName, setObjectName] = useState('');
            const [rotationX, setRotationX] = useState(0.5);
            const [rotationY, setRotationY] = useState(0.5);
            const [loading, setLoading] = useState(false);
            const [generatedImage, setGeneratedImage] = useState(null);
            const [hasTransparency, setHasTransparency] = useState(false);
            const [error, setError] = useState(null);
            const [warning, setWarning] = useState(null);
            const [resolution, setResolution] = useState('1024x1024');
            
            const cubeRef = useRef(null);
            const sceneRef = useRef(null);
            const cameraRef = useRef(null);
            const rendererRef = useRef(null);
            const cubeObjectRef = useRef(null);
            const rotationXRef = useRef(0.5);
            const rotationYRef = useRef(0.5);

            // Resolution options
            const resolutionOptions = [
                { value: '1024x1024', label: '1K', details: '1024×1024' },
                { value: '1536x1536', label: '1.5K', details: '1536×1536' },
                { value: '2048x2048', label: '2K', details: '2048×2048' },
                { value: '2560x2560', label: '2.5K', details: '2560×2560' }
            ];

            // Save API key
            useEffect(() => {
                if (replicateApiKey) localStorage.setItem('replicateApiKey', replicateApiKey);
            }, [replicateApiKey]);

            // Update rotation refs
            useEffect(() => {
                rotationXRef.current = rotationX;
                rotationYRef.current = rotationY;
            }, [rotationX, rotationY]);

            // Initialize Three.js scene
            useEffect(() => {
                if (!cubeRef.current) return;

                const scene = new THREE.Scene();
                const camera = new THREE.PerspectiveCamera(75, 1, 0.1, 1000);
                const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                
                renderer.setSize(250, 250);
                renderer.setClearColor(0x0a0e1a, 1);
                cubeRef.current.appendChild(renderer.domElement);

                // Create cube with colored faces
                const geometry = new THREE.BoxGeometry(2, 2, 2);
                
                // Define materials for each face with different colors
                // Order: Right, Left, Top, Bottom, Front, Back
                const materials = [
                    new THREE.MeshBasicMaterial({ color: 0x3b82f6, opacity: 0.6, transparent: true }), // Right - Blue
                    new THREE.MeshBasicMaterial({ color: 0x8b5cf6, opacity: 0.6, transparent: true }), // Left - Purple
                    new THREE.MeshBasicMaterial({ color: 0x10b981, opacity: 0.6, transparent: true }), // Top - Green
                    new THREE.MeshBasicMaterial({ color: 0x6b7280, opacity: 0.4, transparent: true }), // Bottom - Gray
                    new THREE.MeshBasicMaterial({ color: 0x00ffff, opacity: 0.7, transparent: true }), // Front - Cyan (Brightest)
                    new THREE.MeshBasicMaterial({ color: 0x1e293b, opacity: 0.5, transparent: true })  // Back - Dark
                ];
                
                const cube = new THREE.Mesh(geometry, materials);
                
                // Add wireframe edges
                const edges = new THREE.EdgesGeometry(geometry);
                const lineMaterial = new THREE.LineBasicMaterial({ color: 0x00d4ff, linewidth: 2 });
                const wireframe = new THREE.LineSegments(edges, lineMaterial);
                cube.add(wireframe);
                
                scene.add(cube);
                camera.position.z = 5;

                sceneRef.current = scene;
                cameraRef.current = camera;
                rendererRef.current = renderer;
                cubeObjectRef.current = cube;

                const animate = () => {
                    requestAnimationFrame(animate);
                    // Use refs to get current rotation values
                    cube.rotation.x = rotationXRef.current;
                    cube.rotation.y = rotationYRef.current;
                    renderer.render(scene, camera);
                };
                animate();

                return () => {
                    renderer.dispose();
                    cubeRef.current?.removeChild(renderer.domElement);
                };
            }, []);

            // Update cube rotation (backup method)
            useEffect(() => {
                if (cubeObjectRef.current) {
                    cubeObjectRef.current.rotation.x = rotationX;
                    cubeObjectRef.current.rotation.y = rotationY;
                }
            }, [rotationX, rotationY]);

            const getCameraAngle = () => {
                const xDeg = Math.round((rotationX * 180 / Math.PI) % 360);
                const yDeg = Math.round((rotationY * 180 / Math.PI) % 360);
                
                // Normalize angles to 0-360
                const normalizedX = ((xDeg % 360) + 360) % 360;
                const normalizedY = ((yDeg % 360) + 360) % 360;
                
                // Front view (looking straight at front)
                if (normalizedX < 30 && normalizedY < 30) 
                    return { display: "정면 (Front)", prompt: "straight front view, facing camera directly" };
                
                // Right side view
                if (normalizedX < 30 && normalizedY > 60 && normalizedY < 120) 
                    return { display: "우측면 (Right)", prompt: "right side view, 90 degrees from front" };
                
                // Back view
                if (normalizedX < 30 && normalizedY > 150 && normalizedY < 210) 
                    return { display: "후면 (Back)", prompt: "back view, rear facing" };
                
                // Left side view
                if (normalizedX < 30 && (normalizedY > 240 && normalizedY < 300)) 
                    return { display: "좌측면 (Left)", prompt: "left side view, 90 degrees from front" };
                
                // Top view (bird's eye)
                if (normalizedX > 60 && normalizedX < 120) 
                    return { display: "상단 (Top)", prompt: "top view, bird's eye view from directly above" };
                
                // Bottom view
                if (normalizedX > 240 && normalizedX < 300) 
                    return { display: "하단 (Bottom)", prompt: "bottom view, looking up from below" };
                
                // Three-quarter views (most common for product renders)
                if (normalizedX > 20 && normalizedX < 50 && normalizedY > 20 && normalizedY < 60) 
                    return { display: "우상단 3/4 (Top-Right 3/4)", prompt: "three-quarter view from top right, elevated 30 degrees, rotated 45 degrees" };
                
                if (normalizedX > 20 && normalizedX < 50 && normalizedY > 300 && normalizedY < 340) 
                    return { display: "좌상단 3/4 (Top-Left 3/4)", prompt: "three-quarter view from top left, elevated 30 degrees, rotated 45 degrees" };
                
                if (normalizedX > 20 && normalizedX < 50 && normalizedY > 150 && normalizedY < 210) 
                    return { display: "후상단 3/4 (Back 3/4)", prompt: "three-quarter back view from above, elevated 30 degrees" };
                
                // Isometric-style views
                if (normalizedX > 30 && normalizedX < 60) {
                    if (normalizedY > 30 && normalizedY < 90)
                        return { display: "아이소메트릭 우측 (Isometric Right)", prompt: "isometric view from the right, 35-degree angle" };
                    if (normalizedY > 270 && normalizedY < 330)
                        return { display: "아이소메트릭 좌측 (Isometric Left)", prompt: "isometric view from the left, 35-degree angle" };
                }
                
                // General angled view
                const angle = normalizedX > 45 ? "high angle" : "eye level";
                const rotation = normalizedY < 90 ? "slightly rotated right" : normalizedY < 180 ? "rotated" : normalizedY < 270 ? "slightly rotated left" : "facing forward";
                
                return { 
                    display: "각진 뷰 (Angled)", 
                    prompt: `${angle} view, ${rotation}, professional product photography angle` 
                };
            };

            const cameraAngleData = getCameraAngle();
            const cameraAngle = cameraAngleData.display;

            const handleMouseDown = (e) => {
                const startX = e.clientX;
                const startY = e.clientY;
                const startRotX = rotationX;
                const startRotY = rotationY;

                const handleMouseMove = (e) => {
                    const deltaX = e.clientX - startX;
                    const deltaY = e.clientY - startY;
                    setRotationX(startRotX + deltaY * 0.01);
                    setRotationY(startRotY + deltaX * 0.01);
                };

                const handleMouseUp = () => {
                    document.removeEventListener('mousemove', handleMouseMove);
                    document.removeEventListener('mouseup', handleMouseUp);
                };

                document.addEventListener('mousemove', handleMouseMove);
                document.addEventListener('mouseup', handleMouseUp);
            };

            const resetAngle = () => {
                setRotationX(0.5);
                setRotationY(0.5);
            };

            const setPresetAngle = (x, y) => {
                setRotationX(x);
                setRotationY(y);
            };

            const handleGenerate = async () => {
                if (!replicateApiKey || !objectName) return;

                setLoading(true);
                setError(null);
                setWarning(null);
                setGeneratedImage(null);

                const cameraDesc = cameraAngleData.prompt;

                const prompt = `Professional 3D render of a ${objectName}. 
Camera: ${cameraDesc}.
Style: Ultra-realistic 3D product render with clean professional studio lighting, high detail and quality, photorealistic materials and textures.
Composition: Center the object in frame with proper composition and depth. Neutral or white background.
Quality: ${resolution} resolution, sharp details, professional product photography quality.`;

                try {
                    const response = await fetch('/api/generate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            replicateApiKey,
                            prompt,
                            resolution
                        })
                    });

                    const data = await response.json();

                    if (data.error) {
                        setError(data.error.message);
                    } else {
                        setGeneratedImage(`data:image/png;base64,${data.image}`);
                        setHasTransparency(data.hasTransparency);
                        setWarning(data.warning);
                    }
                } catch (err) {
                    setError(`생성 실패: ${err.message}`);
                } finally {
                    setLoading(false);
                }
            };

            const downloadImage = () => {
                if (!generatedImage) return;
                const link = document.createElement('a');
                link.href = generatedImage;
                link.download = `${objectName}-${cameraAngle}-${resolution}.png`;
                link.click();
            };

            return (
                <div className="container">
                    <div className="header">
                        <div className="header-left">
                            <h1>PixelSquid 3D 오브젝트 생성기
                                <span className="success-badge">Flux AI</span>
                            </h1>
                            <p className="subtitle">
                                Flux AI로 고품질 3D 오브젝트 생성 + 자동 배경 제거
                            </p>
                        </div>
                        <div className="header-right">
                            <div className="api-key-group" style={{gridColumn: '1 / -1'}}>
                                <label className="api-key-label">Replicate API Key</label>
                                <input
                                    type="password"
                                    className="api-key-input"
                                    value={replicateApiKey}
                                    onChange={(e) => setReplicateApiKey(e.target.value)}
                                    placeholder="Replicate API 키 입력"
                                />
                                <div className="api-key-hint">
                                    <a href="https://replicate.com/account/api-tokens" target="_blank">API 키 발급받기</a>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="content">
                        {/* Left Panel */}
                        <div className="panel">
                            <h2 className="panel-title">이미지 설정</h2>
                            
                            <div 
                                ref={cubeRef} 
                                className="cube-container"
                                onMouseDown={handleMouseDown}
                                style={{ cursor: 'grab' }}
                            />

                            <div className="cube-legend">
                                <div className="legend-item">
                                    <div className="legend-color color-front"></div>
                                    <span>앞면 (Front)</span>
                                </div>
                                <div className="legend-item">
                                    <div className="legend-color color-top"></div>
                                    <span>위 (Top)</span>
                                </div>
                                <div className="legend-item">
                                    <div className="legend-color color-right"></div>
                                    <span>우측 (Right)</span>
                                </div>
                                <div className="legend-item">
                                    <div className="legend-color color-left"></div>
                                    <span>좌측 (Left)</span>
                                </div>
                                <div className="legend-item">
                                    <div className="legend-color color-bottom"></div>
                                    <span>아래 (Bottom)</span>
                                </div>
                                <div className="legend-item">
                                    <div className="legend-color color-back"></div>
                                    <span>뒤 (Back)</span>
                                </div>
                            </div>

                            <div className="reset-button-container">
                                <button className="btn-reset" onClick={resetAngle}>
                                    🔄 큐브 각도 리셋
                                </button>
                            </div>

                            <div className="preset-angles-container">
                                <label style={{marginBottom: '12px', display: 'block', fontSize: '13px', color: '#94a3b8'}}>
                                    📐 빠른 각도 선택
                                </label>
                                <div className="preset-angles-grid">
                                    <button className="preset-angle-btn" onClick={() => setPresetAngle(0, 0)}>
                                        정면
                                    </button>
                                    <button className="preset-angle-btn" onClick={() => setPresetAngle(0, Math.PI/2)}>
                                        우측
                                    </button>
                                    <button className="preset-angle-btn" onClick={() => setPresetAngle(0, Math.PI)}>
                                        후면
                                    </button>
                                    <button className="preset-angle-btn" onClick={() => setPresetAngle(0.5, 0.5)}>
                                        3/4 우상
                                    </button>
                                    <button className="preset-angle-btn" onClick={() => setPresetAngle(Math.PI/2, 0)}>
                                        상단
                                    </button>
                                    <button className="preset-angle-btn" onClick={() => setPresetAngle(0.5, -0.5)}>
                                        3/4 좌상
                                    </button>
                                </div>
                            </div>

                            <div className="angle-display">
                                <div className="angle-value">
                                    <div className="angle-label">X Rotation</div>
                                    <div className="angle-number">{Math.round((rotationX * 180 / Math.PI) % 360)}°</div>
                                </div>
                                <div className="angle-value">
                                    <div className="angle-label">Y Rotation</div>
                                    <div className="angle-number">{Math.round((rotationY * 180 / Math.PI) % 360)}°</div>
                                </div>
                            </div>

                            <div className="camera-description">📷 {cameraAngle}</div>

                            <div className="form-group">
                                <label>📐 이미지 해상도</label>
                                <div className="resolution-group">
                                    {resolutionOptions.map(option => (
                                        <button
                                            key={option.value}
                                            className={`resolution-btn ${resolution === option.value ? 'active' : ''}`}
                                            onClick={() => setResolution(option.value)}
                                        >
                                            <div className="resolution-label">{option.label}</div>
                                            <div className="resolution-details">{option.details}</div>
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div className="form-group">
                                <label htmlFor="objectInput">🎯 오브젝트 이름 (한글/영어)</label>
                                <input 
                                    type="text" 
                                    id="objectInput"
                                    value={objectName}
                                    onChange={(e) => setObjectName(e.target.value)}
                                    placeholder="예: 커피잔, coffee mug, 노트북, laptop"
                                />
                            </div>

                            <div className="form-group">
                                <button 
                                    className="btn-primary" 
                                    onClick={handleGenerate}
                                    disabled={loading || !objectName || !replicateApiKey}
                                    style={{ width: '100%' }}
                                >
                                    {loading ? '생성 중...' : '🎨 이미지 생성'}
                                </button>
                            </div>

                        </div>

                        {/* Right Panel */}
                        <div className="panel">
                            <h2 className="panel-title">생성 결과</h2>
                            
                            <div className="result-panel">
                                {loading && (
                                    <div style={{ textAlign: 'center' }}>
                                        <div className="loading-spinner"></div>
                                        <p style={{ color: '#94a3b8' }}>AI가 이미지를 생성하고 배경을 제거하고 있습니다...</p>
                                        <p style={{ fontSize: '12px', color: '#64748b', marginTop: '8px' }}>해상도: {resolution} (약 15-60초 소요)</p>
                                    </div>
                                )}

                                {error && !loading && (
                                    <div className="error-message">
                                        ❌ {error}
                                    </div>
                                )}

                                {generatedImage && !loading && (
                                    <div style={{ width: '100%', textAlign: 'center' }}>
                                        <img 
                                            src={generatedImage} 
                                            alt="Generated" 
                                            className="result-image"
                                        />
                                        <div className={`transparency-badge ${hasTransparency ? 'yes' : 'no'}`}>
                                            {hasTransparency ? '✅ 투명 배경 적용됨' : '⚠️ 배경 제거 대기 중'}
                                        </div>
                                        {warning && (
                                            <div className="warning-message">
                                                💡 {warning}
                                            </div>
                                        )}
                                        <button 
                                            className="btn-primary" 
                                            onClick={downloadImage}
                                            style={{ marginTop: '20px', width: '100%' }}
                                        >
                                            💾 PNG 다운로드 ({resolution})
                                        </button>
                                    </div>
                                )}

                                {!loading && !error && !generatedImage && (
                                    <div style={{ textAlign: 'center', color: '#64748b' }}>
                                        <div style={{ fontSize: '48px', marginBottom: '16px' }}>🎨</div>
                                        <p>왼쪽에서 각도와 해상도를 선택하고<br/>오브젝트 이름을 입력한 후<br/>생성 버튼을 눌러주세요</p>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<PixelSquidGenerator />, document.getElementById('root'));
    </script>
</body>
</html>
