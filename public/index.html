<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelSquid 3D 오브젝트 생성기 - Flux AI</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif;
            background: linear-gradient(135deg, #0a0e1a 0%, #1a1f35 100%);
            color: #ffffff;
            min-height: 100vh;
            padding: 20px;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 0;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: linear-gradient(135deg, #1e2842 0%, #141b2e 100%);
            border-radius: 24px;
            padding: 32px 40px;
            margin-bottom: 40px;
            border: 1px solid rgba(0, 212, 255, 0.2);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 40px;
        }

        .header-left {
            flex: 0 0 auto;
        }

        .header-right {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            max-width: 700px;
        }

        h1 {
            font-size: 36px;
            font-weight: 600;
            background: linear-gradient(135deg, #00ffff, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            white-space: nowrap;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 14px;
            max-width: 400px;
        }

        .success-badge {
            display: inline-block;
            margin-left: 16px;
            font-size: 16px;
            padding: 4px 12px;
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid rgba(16, 185, 129, 0.4);
            border-radius: 8px;
            color: #10b981;
            font-weight: 600;
        }

        .api-key-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .api-key-label {
            font-size: 12px;
            font-weight: 600;
            color: #ffffff;
        }

        .api-key-input {
            width: 100%;
            padding: 10px 12px;
            background: #0a0e1a;
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 8px;
            color: #ffffff;
            font-family: inherit;
            font-size: 13px;
            transition: all 0.3s ease;
        }

        .api-key-input:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.2);
        }

        .api-key-hint {
            font-size: 10px;
            color: #64748b;
        }

        .api-key-hint a {
            color: #00ffff;
            text-decoration: none;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        .panel {
            background: rgba(30, 40, 66, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 32px;
            border: 1px solid rgba(0, 212, 255, 0.2);
        }

        .panel-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .panel-title::before {
            content: '';
            width: 4px;
            height: 24px;
            background: linear-gradient(180deg, #00ffff, #00d4ff);
            border-radius: 2px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            background: #0a0e1a;
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 8px;
            color: #ffffff;
            font-family: inherit;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.2);
        }

        /* Resolution selector styles */
        .resolution-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .resolution-btn {
            flex: 1;
            min-width: 100px;
            padding: 12px 16px;
            background: #0a0e1a;
            border: 2px solid rgba(0, 212, 255, 0.3);
            border-radius: 8px;
            color: #94a3b8;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .resolution-btn:hover {
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.05);
            color: #ffffff;
        }

        .resolution-btn.active {
            background: linear-gradient(135deg, #00ffff, #00d4ff);
            border-color: #00d4ff;
            color: #0a0e1a;
        }

        .resolution-btn.disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: rgba(148, 163, 184, 0.15);
        }

        .resolution-btn.disabled:hover {
            border-color: rgba(148, 163, 184, 0.15);
            background: #0a0e1a;
            color: #94a3b8;
        }

        .resolution-label {
            display: block;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .resolution-details {
            font-size: 11px;
            opacity: 0.8;
        }

        .button-group {
            display: flex;
            gap: 16px;
        }

        .btn-primary, .btn-secondary {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-family: inherit;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00ffff, #00d4ff);
            color: #0a0e1a;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: rgba(0, 212, 255, 0.1);
            color: #00ffff;
            border: 1px solid rgba(0, 212, 255, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(0, 212, 255, 0.2);
        }

        .cube-container {
            width: 250px;
            height: 250px;
            margin: 0 auto 16px;
            background: #0a0e1a;
            border-radius: 12px;
            border: 1px solid rgba(0, 212, 255, 0.2);
        }

        .cube-legend {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 24px;
            padding: 16px;
            background: rgba(0, 212, 255, 0.05);
            border-radius: 8px;
            border: 1px solid rgba(0, 212, 255, 0.15);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #94a3b8;
        }

        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .color-front { background: #00ffff; }
        .color-top { background: #10b981; }
        .color-right { background: #3b82f6; }
        .color-left { background: #8b5cf6; }
        .color-bottom { background: #6b7280; }
        .color-back { background: #1e293b; }

        .reset-button-container {
            margin-bottom: 24px;
        }

        .btn-reset {
            width: 100%;
            padding: 12px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            color: #ef4444;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-reset:hover {
            background: rgba(239, 68, 68, 0.2);
            border-color: #ef4444;
        }

        .preset-angles-container {
            margin-bottom: 24px;
        }

        .preset-angles-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .preset-angle-btn {
            padding: 10px 8px;
            background: #0a0e1a;
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 6px;
            color: #94a3b8;
            font-family: inherit;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .preset-angle-btn:hover {
            background: rgba(0, 212, 255, 0.1);
            border-color: #00d4ff;
            color: #00d4ff;
        }

        .angle-display {
            display: flex;
            justify-content: space-around;
            margin-bottom: 24px;
            padding: 16px;
            background: #0a0e1a;
            border-radius: 8px;
        }

        .angle-value {
            text-align: center;
        }

        .angle-label {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 4px;
        }

        .angle-number {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #00ffff, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .camera-description {
            text-align: center;
            font-size: 14px;
            color: #00ffff;
            margin-bottom: 24px;
            padding: 12px;
            background: rgba(0, 212, 255, 0.1);
            border-radius: 8px;
            border: 1px solid rgba(0, 212, 255, 0.2);
        }

        .result-panel {
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0e1a;
            border-radius: 12px;
            padding: 32px;
        }

        .result-image {
            max-width: 100%;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .transparency-badge {
            margin-top: 16px;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            display: inline-block;
        }

        .transparency-badge.yes {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #10b981;
        }

        .transparency-badge.no {
            background: rgba(251, 191, 36, 0.2);
            border: 1px solid rgba(251, 191, 36, 0.4);
            color: #fbbf24;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(0, 212, 255, 0.2);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            padding: 20px;
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.4);
            border-radius: 8px;
            color: #ef4444;
        }

        .warning-message {
            margin-top: 12px;
            padding: 12px;
            background: rgba(251, 191, 36, 0.2);
            border: 1px solid rgba(251, 191, 36, 0.4);
            border-radius: 8px;
            color: #fbbf24;
            font-size: 13px;
        }

        .info-box {
            padding: 16px;
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 8px;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function PixelSquidGenerator() {
            const [replicateApiKey, setReplicateApiKey] = useState(localStorage.getItem('replicateApiKey') || '');
            const [objectName, setObjectName] = useState('');
            const [rotationX, setRotationX] = useState(0.5);
            const [rotationY, setRotationY] = useState(0.5);
            const [loading, setLoading] = useState(false);
            const [generatedImage, setGeneratedImage] = useState(null);
            const [originalImage, setOriginalImage] = useState(null); // Image before BG removal
            const [referenceImage, setReferenceImage] = useState(null); // Reference image for img2img
            const [hasTransparency, setHasTransparency] = useState(false);
            const [error, setError] = useState(null);
            const [warning, setWarning] = useState(null);
            const [resolution, setResolution] = useState('1024x1024'); // Default 1K
            const [model, setModel] = useState('flux-schnell'); // Default FLUX Schnell
            
            const cubeRef = useRef(null);
            const sceneRef = useRef(null);
            const cameraRef = useRef(null);
            const rendererRef = useRef(null);
            const cubeObjectRef = useRef(null);
            const rotationXRef = useRef(0.5);
            const rotationYRef = useRef(0.5);

            // Resolution options - max 2K
            const resolutionOptions = [
                { value: '1024x1024', label: '1K', details: '1024×1024', allModels: true },
                { value: '1440x1440', label: '1.5K', details: '1440×1440', needsImagen: true },
                { value: '2048x2048', label: '2K', details: '2048×2048', needsImagen: true }
            ];

            // Auto-select model based on resolution
            // FLUX Schnell is default (can upscale to 2K)
            // Users can manually switch to SDXL (1K only) or FLUX Pro Ultra (native 2K)
            useEffect(() => {
                // Only auto-select on first load, don't override manual selection
                if (!model) {
                    setModel('flux-schnell');
                    console.log('Default model: FLUX Schnell');
                }
            }, []);

            // Model options - 3 models with upscaling!
            const modelOptions = [
                { value: 'flux-schnell', label: 'FLUX Schnell', details: '빠름, 자동 업스케일', cost: '$', maxRes: '2048x2048', canUpscale: true },
                { value: 'nano-banana', label: 'Nano Banana', details: 'Google, 자동 업스케일', cost: '$$', maxRes: '2048x2048', canUpscale: true },
                { value: 'flux-pro-ultra', label: 'FLUX Pro Ultra', details: '네이티브 2K, 최고품질', cost: '$$$', maxRes: '2048x2048', for2K: true }
            ];

            // Save API key
            useEffect(() => {
                if (replicateApiKey) localStorage.setItem('replicateApiKey', replicateApiKey);
            }, [replicateApiKey]);

            // Update rotation refs
            useEffect(() => {
                rotationXRef.current = rotationX;
                rotationYRef.current = rotationY;
            }, [rotationX, rotationY]);

            // Initialize Three.js scene
            useEffect(() => {
                if (!cubeRef.current) return;

                const scene = new THREE.Scene();
                const camera = new THREE.PerspectiveCamera(75, 1, 0.1, 1000);
                const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                
                renderer.setSize(250, 250);
                renderer.setClearColor(0x0a0e1a, 1);
                cubeRef.current.appendChild(renderer.domElement);

                // Create cube with colored faces
                const geometry = new THREE.BoxGeometry(2, 2, 2);
                
                // Define materials for each face with different colors
                // Order: Right, Left, Top, Bottom, Front, Back
                const materials = [
                    new THREE.MeshBasicMaterial({ color: 0x3b82f6, opacity: 0.6, transparent: true }), // Right - Blue
                    new THREE.MeshBasicMaterial({ color: 0x8b5cf6, opacity: 0.6, transparent: true }), // Left - Purple
                    new THREE.MeshBasicMaterial({ color: 0x10b981, opacity: 0.6, transparent: true }), // Top - Green
                    new THREE.MeshBasicMaterial({ color: 0x6b7280, opacity: 0.4, transparent: true }), // Bottom - Gray
                    new THREE.MeshBasicMaterial({ color: 0x00ffff, opacity: 0.7, transparent: true }), // Front - Cyan (Brightest)
                    new THREE.MeshBasicMaterial({ color: 0x1e293b, opacity: 0.5, transparent: true })  // Back - Dark
                ];
                
                const cube = new THREE.Mesh(geometry, materials);
                
                // Add wireframe edges
                const edges = new THREE.EdgesGeometry(geometry);
                const lineMaterial = new THREE.LineBasicMaterial({ color: 0x00d4ff, linewidth: 2 });
                const wireframe = new THREE.LineSegments(edges, lineMaterial);
                cube.add(wireframe);
                
                scene.add(cube);
                camera.position.z = 5;

                sceneRef.current = scene;
                cameraRef.current = camera;
                rendererRef.current = renderer;
                cubeObjectRef.current = cube;

                const animate = () => {
                    requestAnimationFrame(animate);
                    // Use refs to get current rotation values
                    cube.rotation.x = rotationXRef.current;
                    cube.rotation.y = rotationYRef.current;
                    renderer.render(scene, camera);
                };
                animate();

                return () => {
                    renderer.dispose();
                    cubeRef.current?.removeChild(renderer.domElement);
                };
            }, []);

            // Update cube rotation (backup method)
            useEffect(() => {
                if (cubeObjectRef.current) {
                    cubeObjectRef.current.rotation.x = rotationX;
                    cubeObjectRef.current.rotation.y = rotationY;
                }
            }, [rotationX, rotationY]);

            const getCameraAngle = () => {
                const xDeg = Math.round((rotationX * 180 / Math.PI) % 360);
                const yDeg = Math.round((rotationY * 180 / Math.PI) % 360);
                
                // Normalize angles to 0-360
                const normalizedX = ((xDeg % 360) + 360) % 360;
                let normalizedY = ((yDeg % 360) + 360) % 360;
                
                // CRITICAL FIX: Invert Y rotation to match cube visibility
                // When cube shows RIGHT side (Y=29°), we need to generate showing RIGHT side
                // Standard Three.js +Y rotation shows left, so we invert
                normalizedY = (360 - normalizedY) % 360;
                
                // Helper function to check if angle is within range
                const inRange = (angle, target, tolerance = 25) => {
                    return Math.abs(angle - target) <= tolerance || 
                           Math.abs(angle - target + 360) <= tolerance ||
                           Math.abs(angle - target - 360) <= tolerance;
                };

                
                // CARDINAL VIEWS (Front, Right, Back, Left, Top, Bottom) - 5 degree tolerance
                
                // FRONT VIEW (0°)
                if (inRange(normalizedX, 0, 5) && inRange(normalizedY, 0, 5)) 
                    return { display: "정면 (Front)", prompt: "front view of object, object facing directly toward camera, perfectly centered composition, straight-on perspective" };
                
                // RIGHT SIDE VIEW (90°) - Object's right side facing camera
                if (inRange(normalizedX, 0, 5) && inRange(normalizedY, 90, 5)) 
                    return { display: "우측면 (Right)", prompt: "right side view of object, showing the object's right side, perfect 90 degree side profile, straight-on side perspective" };
                
                // BACK VIEW (180°)
                if (inRange(normalizedX, 0, 5) && (inRange(normalizedY, 180, 5) || inRange(normalizedY, -180, 5))) 
                    return { display: "후면 (Back)", prompt: "back view of object, object's rear side facing camera, straight-on back perspective" };
                
                // LEFT SIDE VIEW (270°/-90°)
                if (inRange(normalizedX, 0, 5) && (inRange(normalizedY, 270, 5) || inRange(normalizedY, -90, 5))) 
                    return { display: "좌측면 (Left)", prompt: "left side view of object, showing the object's left side, perfect 90 degree side profile, straight-on side perspective" };
                
                // TOP VIEW (90° elevation)
                if (inRange(normalizedX, 90, 5)) 
                    return { display: "상단 (Top)", prompt: "top view of object, bird's eye perspective looking down at the object from directly above, flat lay view" };
                
                // BOTTOM VIEW (-90°/270° elevation)
                if (inRange(normalizedX, 270, 5) || inRange(normalizedX, -90, 5)) 
                    return { display: "하단 (Bottom)", prompt: "bottom view of object, looking up at the underside of the object, worm's eye perspective" };
                
                // DETAILED 15-DEGREE ANGLE VIEWS (Eye Level)
                
                // Front-Right angles (345°-30°)
                if (normalizedX < 10) {
                    if (inRange(normalizedY, 15, 8)) return { display: "우전면 15° (Front-Right 15°)", prompt: "slightly angled front view, 15 degrees to the right, showing mostly front with hint of right side" };
                    if (inRange(normalizedY, 30, 8)) return { display: "우전면 30° (Front-Right 30°)", prompt: "angled front view, 30 degrees to the right, showing front with visible right side" };
                    if (inRange(normalizedY, 45, 8)) return { display: "우전면 45° (Front-Right 45°)", prompt: "diagonal front view, 45 degrees to the right, equal emphasis on front and right side" };
                    if (inRange(normalizedY, 60, 8)) return { display: "우측면전 60° (Right-Front 60°)", prompt: "right-biased view, 60 degrees from front, showing mostly right side with front visible" };
                    if (inRange(normalizedY, 75, 8)) return { display: "우측면전 75° (Right-Front 75°)", prompt: "mostly right side view, 75 degrees from front, right side prominent with front edge visible" };
                }
                
                // Right-Back angles (90°-135°)
                if (normalizedX < 10) {
                    if (inRange(normalizedY, 105, 8)) return { display: "우측면후 105° (Right-Back 105°)", prompt: "right side with back edge, 105 degrees from front, right side prominent with back starting to show" };
                    if (inRange(normalizedY, 120, 8)) return { display: "우측면후 120° (Right-Back 120°)", prompt: "right side to back view, 120 degrees from front, right side and back equally visible" };
                    if (inRange(normalizedY, 135, 8)) return { display: "우후면 135° (Right-Back 135°)", prompt: "diagonal back view from right, 135 degrees from front, showing back with right side visible" };
                    if (inRange(normalizedY, 150, 8)) return { display: "우후면 150° (Right-Back 150°)", prompt: "mostly back view from right, 150 degrees from front, back prominent with right edge visible" };
                    if (inRange(normalizedY, 165, 8)) return { display: "우후면 165° (Right-Back 165°)", prompt: "near back view from right, 165 degrees from front, mostly back with hint of right side" };
                }
                
                // Back-Left angles (180°-225°)
                if (normalizedX < 10) {
                    if (inRange(normalizedY, 195, 8)) return { display: "좌후면 195° (Left-Back 195°)", prompt: "near back view from left, 195 degrees from front, mostly back with hint of left side" };
                    if (inRange(normalizedY, 210, 8)) return { display: "좌후면 210° (Left-Back 210°)", prompt: "mostly back view from left, 210 degrees from front, back prominent with left edge visible" };
                    if (inRange(normalizedY, 225, 8)) return { display: "좌후면 225° (Left-Back 225°)", prompt: "diagonal back view from left, 225 degrees from front, showing back with left side visible" };
                    if (inRange(normalizedY, 240, 8)) return { display: "좌측면후 240° (Left-Back 240°)", prompt: "left side to back view, 240 degrees from front, left side and back equally visible" };
                    if (inRange(normalizedY, 255, 8)) return { display: "좌측면후 255° (Left-Back 255°)", prompt: "left side with back edge, 255 degrees from front, left side prominent with back starting to show" };
                }
                
                // Left-Front angles (270°-315°)
                if (normalizedX < 10) {
                    if (inRange(normalizedY, 285, 8)) return { display: "좌측면전 285° (Left-Front 285°)", prompt: "mostly left side view, 285 degrees from front, left side prominent with front edge visible" };
                    if (inRange(normalizedY, 300, 8)) return { display: "좌측면전 300° (Left-Front 300°)", prompt: "left-biased view, 300 degrees from front, showing mostly left side with front visible" };
                    if (inRange(normalizedY, 315, 8)) return { display: "좌전면 315° (Front-Left 315°)", prompt: "diagonal front view, 315 degrees (45 degrees to left), equal emphasis on front and left side" };
                    if (inRange(normalizedY, 330, 8)) return { display: "좌전면 330° (Front-Left 330°)", prompt: "angled front view, 330 degrees (30 degrees to left), showing front with visible left side" };
                    if (inRange(normalizedY, 345, 8)) return { display: "좌전면 345° (Front-Left 345°)", prompt: "slightly angled front view, 345 degrees (15 degrees to left), showing mostly front with hint of left side" };
                }
                
                // THREE-QUARTER ELEVATED VIEWS (20-40° elevation)
                
                // Elevated Front-Right 3/4
                if (normalizedX > 15 && normalizedX < 45 && normalizedY > 320 && normalizedY < 350) 
                    return { display: "우상단 3/4 (Front-Right 3/4)", prompt: "elevated three-quarter angle showing both the front and right side of the object, object rotated to prominently display its right side along with the front, raised camera angle 20-30 degrees" };
                
                // Elevated Front-Left 3/4
                if (normalizedX > 15 && normalizedX < 45 && normalizedY > 10 && normalizedY < 40) 
                    return { display: "좌상단 3/4 (Front-Left 3/4)", prompt: "elevated three-quarter angle showing both the front and left side of the object, object rotated to prominently display its left side along with the front, raised camera angle 20-30 degrees" };
                
                // Elevated Back-Right 3/4
                if (normalizedX > 15 && normalizedX < 45 && normalizedY > 140 && normalizedY < 170) 
                    return { display: "후우상단 3/4 (Back-Right 3/4)", prompt: "elevated three-quarter rear angle showing the back and right side of the object, raised camera angle 20-30 degrees" };
                
                // Elevated Back-Left 3/4
                if (normalizedX > 15 && normalizedX < 45 && normalizedY > 190 && normalizedY < 220) 
                    return { display: "후좌상단 3/4 (Back-Left 3/4)", prompt: "elevated three-quarter rear angle showing the back and left side of the object, raised camera angle 20-30 degrees" };
                
                // ISOMETRIC VIEWS (30-35° elevation, 45° rotation)
                
                // Isometric Front-Right
                if (normalizedX > 28 && normalizedX < 37 && normalizedY > 310 && normalizedY < 350)
                    return { display: "아이소메트릭 우전 (Iso Front-Right)", prompt: "isometric view showing front and right side of object at 30-35 degree elevation and 45 degree rotation, technical drawing perspective, architectural visualization style" };
                
                // Isometric Front-Left
                if (normalizedX > 28 && normalizedX < 37 && normalizedY > 10 && normalizedY < 50)
                    return { display: "아이소메트릭 좌전 (Iso Front-Left)", prompt: "isometric view showing front and left side of object at 30-35 degree elevation and 45 degree rotation, technical drawing perspective, architectural visualization style" };
                
                // Isometric Back-Right
                if (normalizedX > 28 && normalizedX < 37 && normalizedY > 130 && normalizedY < 170)
                    return { display: "아이소메트릭 우후 (Iso Back-Right)", prompt: "isometric view showing back and right side of object at 30-35 degree elevation and 135 degree rotation, technical drawing perspective" };
                
                // Isometric Back-Left
                if (normalizedX > 28 && normalizedX < 37 && normalizedY > 190 && normalizedY < 230)
                    return { display: "아이소메트릭 좌후 (Iso Back-Left)", prompt: "isometric view showing back and left side of object at 30-35 degree elevation and 225 degree rotation, technical drawing perspective" };
                
                // HIGH ANGLE DETAILED VIEWS (50-70° elevation)
                if (normalizedX > 50 && normalizedX < 70) {
                    if (inRange(normalizedY, 0, 20)) return { display: "고각도 정면 (High Front)", prompt: "high angle view from above showing the front of the object, camera elevated 50-70 degrees, bird's eye perspective with front visible" };
                    if (inRange(normalizedY, 45, 20)) return { display: "고각도 우전 (High Front-Right)", prompt: "high angle view showing front-right of object from above, camera elevated 50-70 degrees" };
                    if (inRange(normalizedY, 90, 20)) return { display: "고각도 우측 (High Right)", prompt: "high angle view showing the object's right side from above, camera elevated 50-70 degrees" };
                    if (inRange(normalizedY, 135, 20)) return { display: "고각도 우후 (High Back-Right)", prompt: "high angle view showing back-right of object from above, camera elevated 50-70 degrees" };
                    if (inRange(normalizedY, 180, 20)) return { display: "고각도 후면 (High Back)", prompt: "high angle view showing the object's back from above, camera elevated 50-70 degrees" };
                    if (inRange(normalizedY, 225, 20)) return { display: "고각도 좌후 (High Back-Left)", prompt: "high angle view showing back-left of object from above, camera elevated 50-70 degrees" };
                    if (inRange(normalizedY, 270, 20)) return { display: "고각도 좌측 (High Left)", prompt: "high angle view showing the object's left side from above, camera elevated 50-70 degrees" };
                    if (inRange(normalizedY, 315, 20)) return { display: "고각도 좌전 (High Front-Left)", prompt: "high angle view showing front-left of object from above, camera elevated 50-70 degrees" };
                }
                
                // EXTREME HIGH ANGLE VIEWS (70-85° elevation)
                if (normalizedX > 70 && normalizedX < 85) {
                    if (normalizedY < 45 || normalizedY > 315) return { display: "극고각도 정면 (Very High Front)", prompt: "very high angle view almost from directly above, slight front bias, camera elevated 70-85 degrees, near top-down with front edge visible" };
                    if (normalizedY > 45 && normalizedY < 135) return { display: "극고각도 우측 (Very High Right)", prompt: "very high angle view almost from directly above, slight right bias, camera elevated 70-85 degrees" };
                    if (normalizedY > 135 && normalizedY < 225) return { display: "극고각도 후면 (Very High Back)", prompt: "very high angle view almost from directly above, slight back bias, camera elevated 70-85 degrees" };
                    return { display: "극고각도 좌측 (Very High Left)", prompt: "very high angle view almost from directly above, slight left bias, camera elevated 70-85 degrees" };
                }
                
                // LOW ANGLE VIEWS (-5 to -30° elevation - looking up)
                if (normalizedX > 330 || normalizedX < -5) {
                    const absX = normalizedX > 330 ? 360 - normalizedX : -normalizedX;
                    if (absX < 15) { // Slightly low
                        if (normalizedY < 45 || normalizedY > 315) return { display: "저각도 정면 (Low Front)", prompt: "low angle view looking slightly up at the object's front, camera 5-15 degrees below eye level, slight upward perspective" };
                        if (normalizedY > 45 && normalizedY < 135) return { display: "저각도 우측 (Low Right)", prompt: "low angle view looking slightly up at the object's right side, camera 5-15 degrees below eye level" };
                        if (normalizedY > 135 && normalizedY < 225) return { display: "저각도 후면 (Low Back)", prompt: "low angle view looking slightly up at the object's back, camera 5-15 degrees below eye level" };
                        return { display: "저각도 좌측 (Low Left)", prompt: "low angle view looking slightly up at the object's left side, camera 5-15 degrees below eye level" };
                    } else { // Very low
                        if (normalizedY < 45 || normalizedY > 315) return { display: "극저각도 정면 (Very Low Front)", prompt: "very low angle view looking up at the object's front, camera 15-30 degrees below eye level, dramatic upward perspective" };
                        if (normalizedY > 45 && normalizedY < 135) return { display: "극저각도 우측 (Very Low Right)", prompt: "very low angle view looking up at the object's right side, camera 15-30 degrees below eye level" };
                        if (normalizedY > 135 && normalizedY < 225) return { display: "극저각도 후면 (Very Low Back)", prompt: "very low angle view looking up at the object's back, camera 15-30 degrees below eye level" };
                        return { display: "극저각도 좌측 (Very Low Left)", prompt: "very low angle view looking up at the object's left side, camera 15-30 degrees below eye level" };
                    }
                }
                
                // GENERAL ANGLED VIEW (fallback for any angle not covered above)
                const elevationDesc = normalizedX < 5 ? "eye level" : 
                                     normalizedX < 20 ? "slightly elevated" :
                                     normalizedX < 45 ? "elevated angle" : 
                                     normalizedX < 70 ? "high angle" : "very high angle";
                                     
                const sideDesc = normalizedY < 15 || normalizedY > 345 ? "front of object facing camera" :
                                normalizedY > 330 && normalizedY <= 345 ? "front-left of object visible" :
                                normalizedY > 300 && normalizedY <= 330 ? "left side and front of object visible" :
                                normalizedY > 270 && normalizedY <= 300 ? "left side of object prominently visible" :
                                normalizedY > 240 && normalizedY <= 270 ? "left side and back of object visible" :
                                normalizedY > 210 && normalizedY <= 240 ? "back-left of object visible" :
                                normalizedY > 180 && normalizedY <= 210 ? "back of object facing camera" :
                                normalizedY > 150 && normalizedY <= 180 ? "back-right of object visible" :
                                normalizedY > 120 && normalizedY <= 150 ? "right side and back of object visible" :
                                normalizedY > 90 && normalizedY <= 120 ? "right side of object prominently visible" :
                                normalizedY > 60 && normalizedY <= 90 ? "right side and front of object visible" :
                                normalizedY > 15 && normalizedY <= 60 ? "front-right of object visible" : "front of object facing camera";
                
                return { 
                    display: `${elevationDesc} ${sideDesc.split(' ')[0]}`, 
                    prompt: `${elevationDesc} view with ${sideDesc}, professional product photography, clear composition` 
                };
            };

            const cameraAngleData = getCameraAngle();
            const cameraAngle = cameraAngleData.display;

            const handleMouseDown = (e) => {
                const startX = e.clientX;
                const startY = e.clientY;
                const startRotX = rotationX;
                const startRotY = rotationY;

                const handleMouseMove = (e) => {
                    const deltaX = e.clientX - startX;
                    const deltaY = e.clientY - startY;
                    setRotationX(startRotX + deltaY * 0.01);
                    setRotationY(startRotY + deltaX * 0.01);
                };

                const handleMouseUp = () => {
                    document.removeEventListener('mousemove', handleMouseMove);
                    document.removeEventListener('mouseup', handleMouseUp);
                };

                document.addEventListener('mousemove', handleMouseMove);
                document.addEventListener('mouseup', handleMouseUp);
            };

            const resetAngle = () => {
                setRotationX(0.5);
                setRotationY(0.5);
            };

            const setPresetAngle = (x, y) => {
                setRotationX(x);
                setRotationY(y);
            };

            const handleGenerate = async () => {
                if (!replicateApiKey || !objectName) return;

                setLoading(true);
                setError(null);
                setWarning(null);
                setGeneratedImage(null);
                setOriginalImage(null); // Reset original image too

                const cameraDesc = cameraAngleData.prompt;
                
                // Use light gray background instead of blue to avoid color spill on objects
                // Gray provides enough contrast for BG removal without affecting object colors
                const backgroundDesc = "light gray background (#E5E5E5), clean neutral studio background, no shadows";
                const lightingDesc = "professional white studio lighting, neutral white light, soft white reflections on object, pure white key light and fill light, no colored lighting";

                const prompt = `Professional 3D render of a ${objectName}. 
Camera: ${cameraDesc}.
Background: ${backgroundDesc}.
Lighting: ${lightingDesc}. The object should be lit with pure white light sources only, with natural accurate colors and white highlights. The background should NOT cast any colored light onto the object.
Style: Ultra-realistic 3D product render with clean professional studio lighting, high detail and quality, photorealistic materials and textures, accurate object colors without color contamination.
Composition: IMPORTANT - The object should fill the frame as much as possible without being cropped. The object should be LARGE in the frame, occupying maximum space while remaining completely visible. Center the object with minimal empty space around it. The object should appear close to the camera for maximum size. Tight framing with the object taking up 70-80% of the image area.
Quality: Sharp details, professional product photography quality, true-to-life colors.`;

                try {
                    const response = await fetch('/api/generate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            replicateApiKey,
                            prompt,
                            resolution,
                            model,
                            referenceImage: referenceImage || null  // Send reference image if available
                        })
                    });

                    const data = await response.json();

                    if (data.error) {
                        setError(data.error.message);
                    } else {
                        setGeneratedImage(`data:image/png;base64,${data.image}`);
                        setOriginalImage(`data:image/png;base64,${data.originalImage}`); // Store original
                        setHasTransparency(data.hasTransparency);
                        setWarning(data.warning);
                    }
                } catch (err) {
                    setError(`생성 실패: ${err.message}`);
                } finally {
                    setLoading(false);
                }
            };

            const downloadImage = () => {
                if (!generatedImage) return;
                const link = document.createElement('a');
                link.href = generatedImage;
                link.download = `${objectName}-${cameraAngle}-${resolution}.png`;
                link.click();
            };

            const downloadOriginalImage = () => {
                if (!originalImage) return;
                const link = document.createElement('a');
                link.href = originalImage;
                link.download = `${objectName}-${cameraAngle}-${resolution}-original.png`;
                link.click();
            };

            const handleReferenceImageUpload = (event) => {
                const file = event.target.files[0];
                if (!file) return;
                
                // Check file type
                if (!file.type.startsWith('image/')) {
                    setError('이미지 파일만 업로드 가능합니다.');
                    return;
                }
                
                // Check file size (max 10MB)
                if (file.size > 10 * 1024 * 1024) {
                    setError('파일 크기는 10MB 이하여야 합니다.');
                    return;
                }
                
                // Convert to base64
                const reader = new FileReader();
                reader.onload = (e) => {
                    setReferenceImage(e.target.result);
                    setError(null);
                };
                reader.onerror = () => {
                    setError('이미지 읽기 실패');
                };
                reader.readAsDataURL(file);
            };

            const clearReferenceImage = () => {
                setReferenceImage(null);
                // Clear file input
                const fileInput = document.getElementById('referenceImageInput');
                if (fileInput) fileInput.value = '';
            };

            return (
                <div className="container">
                    <div className="header">
                        <div className="header-left">
                            <h1>PixelSquid 3D 오브젝트 생성기
                                <span className="success-badge">Flux AI</span>
                            </h1>
                            <p className="subtitle">
                                Flux AI로 고품질 3D 오브젝트 생성 + 자동 배경 제거
                            </p>
                        </div>
                        <div className="header-right">
                            <div className="api-key-group" style={{gridColumn: '1 / -1'}}>
                                <label className="api-key-label">Replicate API Key</label>
                                <input
                                    type="password"
                                    className="api-key-input"
                                    value={replicateApiKey}
                                    onChange={(e) => setReplicateApiKey(e.target.value)}
                                    placeholder="Replicate API 키 입력"
                                />
                                <div className="api-key-hint">
                                    <a href="https://replicate.com/account/api-tokens" target="_blank">API 키 발급받기</a>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="content">
                        {/* Left Panel */}
                        <div className="panel">
                            <h2 className="panel-title">이미지 설정</h2>
                            
                            {/* Object Name Input - MOVED TO TOP */}
                            <div className="form-group">
                                <label htmlFor="objectInput">🎯 오브젝트 이름 (한글/영어)</label>
                                <input 
                                    type="text" 
                                    id="objectInput"
                                    value={objectName}
                                    onChange={(e) => setObjectName(e.target.value)}
                                    placeholder="예: 커피잔, coffee mug, 노트북, laptop"
                                />
                            </div>

                            {/* Reference Image Upload */}
                            <div className="form-group">
                                <label htmlFor="referenceImageInput">📷 참조 이미지 (선택사항)</label>
                                <div style={{marginBottom: '8px', fontSize: '12px', color: '#94a3b8'}}>
                                    업로드한 이미지와 비슷한 스타일로 생성됩니다
                                </div>
                                <input 
                                    type="file" 
                                    id="referenceImageInput"
                                    accept="image/*"
                                    onChange={handleReferenceImageUpload}
                                    style={{display: 'none'}}
                                />
                                <div style={{display: 'flex', gap: '8px', alignItems: 'center'}}>
                                    <button 
                                        className="btn-secondary"
                                        onClick={() => document.getElementById('referenceImageInput').click()}
                                        style={{flex: '1', padding: '12px', background: '#1a1f2e', border: '1px solid rgba(0, 212, 255, 0.3)'}}
                                    >
                                        {referenceImage ? '✅ 이미지 선택됨' : '📁 이미지 선택'}
                                    </button>
                                    {referenceImage && (
                                        <button 
                                            className="btn-secondary"
                                            onClick={clearReferenceImage}
                                            style={{padding: '12px 16px', background: '#2d1a1a', border: '1px solid rgba(255, 0, 0, 0.3)', color: '#ff6b6b'}}
                                        >
                                            ❌
                                        </button>
                                    )}
                                </div>
                                {referenceImage && (
                                    <div style={{marginTop: '12px', border: '1px solid rgba(0, 212, 255, 0.3)', borderRadius: '8px', padding: '8px', background: '#0a0e1a'}}>
                                        <img 
                                            src={referenceImage} 
                                            alt="Reference" 
                                            style={{width: '100%', height: 'auto', borderRadius: '4px', maxHeight: '200px', objectFit: 'contain'}}
                                        />
                                    </div>
                                )}
                            </div>

                            {/* Generate Button - MOVED TO TOP */}
                            <div className="form-group">
                                <button 
                                    className="btn-primary" 
                                    onClick={handleGenerate}
                                    disabled={loading || !objectName || !replicateApiKey}
                                    style={{ width: '100%' }}
                                >
                                    {loading ? '생성 중...' : '🎨 이미지 생성'}
                                </button>
                            </div>

                            <hr style={{
                                border: 'none',
                                borderTop: '1px solid rgba(0, 212, 255, 0.2)',
                                margin: '24px 0'
                            }} />
                            
                            {/* Camera Angle Controls */}
                            <div 
                                ref={cubeRef} 
                                className="cube-container"
                                onMouseDown={handleMouseDown}
                                style={{ cursor: 'grab' }}
                            />

                            <div className="cube-legend">
                                <div className="legend-item">
                                    <div className="legend-color color-front"></div>
                                    <span>앞면 (Front)</span>
                                </div>
                                <div className="legend-item">
                                    <div className="legend-color color-top"></div>
                                    <span>위 (Top)</span>
                                </div>
                                <div className="legend-item">
                                    <div className="legend-color color-right"></div>
                                    <span>우측 (Right)</span>
                                </div>
                                <div className="legend-item">
                                    <div className="legend-color color-left"></div>
                                    <span>좌측 (Left)</span>
                                </div>
                                <div className="legend-item">
                                    <div className="legend-color color-bottom"></div>
                                    <span>아래 (Bottom)</span>
                                </div>
                                <div className="legend-item">
                                    <div className="legend-color color-back"></div>
                                    <span>뒤 (Back)</span>
                                </div>
                            </div>

                            <div className="reset-button-container">
                                <button className="btn-reset" onClick={resetAngle}>
                                    🔄 큐브 각도 리셋
                                </button>
                            </div>

                            <div className="preset-angles-container">
                                <label style={{marginBottom: '12px', display: 'block', fontSize: '13px', color: '#94a3b8'}}>
                                    📐 빠른 각도 선택
                                </label>
                                <div className="preset-angles-grid">
                                    <button className="preset-angle-btn" onClick={() => setPresetAngle(0, 0)}>
                                        정면
                                    </button>
                                    <button className="preset-angle-btn" onClick={() => setPresetAngle(0, Math.PI/2)}>
                                        우측
                                    </button>
                                    <button className="preset-angle-btn" onClick={() => setPresetAngle(0, Math.PI)}>
                                        후면
                                    </button>
                                    <button className="preset-angle-btn" onClick={() => setPresetAngle(0.5, 0.5)}>
                                        3/4 우상
                                    </button>
                                    <button className="preset-angle-btn" onClick={() => setPresetAngle(Math.PI/2, 0)}>
                                        상단
                                    </button>
                                    <button className="preset-angle-btn" onClick={() => setPresetAngle(0.5, -0.5)}>
                                        3/4 좌상
                                    </button>
                                </div>
                            </div>

                            <div className="angle-display">
                                <div className="angle-value">
                                    <div className="angle-label">X Rotation</div>
                                    <div className="angle-number">{Math.round((rotationX * 180 / Math.PI) % 360)}°</div>
                                </div>
                                <div className="angle-value">
                                    <div className="angle-label">Y Rotation</div>
                                    <div className="angle-number">{Math.round((rotationY * 180 / Math.PI) % 360)}°</div>
                                </div>
                            </div>

                            <div className="camera-description">📷 {cameraAngle}</div>

                            <div className="form-group">
                                <label>📐 이미지 해상도</label>
                                <div className="resolution-group">
                                    {resolutionOptions.map(option => {
                                        const [optionWidth] = option.value.split('x').map(Number);
                                        let tooltipText = option.details;
                                        if ((model === 'flux-schnell' || model === 'nano-banana') && optionWidth > 1024) {
                                            tooltipText += ' (1K 생성 + 업스케일)';
                                        } else if (model === 'flux-pro-ultra') {
                                            tooltipText += ' (네이티브 생성)';
                                        }
                                        
                                        return (
                                            <button
                                                key={option.value}
                                                className={`resolution-btn ${resolution === option.value ? 'active' : ''}`}
                                                onClick={() => setResolution(option.value)}
                                                title={tooltipText}
                                            >
                                                <div className="resolution-label">{option.label}</div>
                                                <div className="resolution-details">{option.details}</div>
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>

                            <div className="form-group">
                                <label>🤖 AI 모델 선택</label>
                                <div className="info-box" style={{marginBottom: '12px', fontSize: '12px', background: 'rgba(0, 212, 255, 0.1)', borderColor: 'rgba(0, 212, 255, 0.3)'}}>
                                    <strong>현재 선택된 모델:</strong> {modelOptions.find(m => m.value === model)?.label || model}
                                    {resolution === '1024x1024' && ' (1K 최적화)'}
                                    {resolution !== '1024x1024' && ' (고해상도)'}
                                </div>
                                <div className="resolution-group">
                                    {modelOptions.map(option => (
                                        <button
                                            key={option.value}
                                            className={`resolution-btn ${model === option.value ? 'active' : ''}`}
                                            onClick={() => setModel(option.value)}
                                            title={option.details}
                                        >
                                            <div className="resolution-label">{option.label}</div>
                                            <div className="resolution-details">{option.cost}</div>
                                        </button>
                                    ))}
                                </div>
                                <div className="info-box" style={{marginTop: '12px', fontSize: '12px'}}>
                                    <strong>💡 모델 선택 가이드:</strong><br/>
                                    • <strong>FLUX Schnell</strong>: 가장 빠름, 1K 생성 + AI 업스케일로 2K 가능 (기본값)<br/>
                                    • <strong>Nano Banana</strong>: Google 모델, 1K 생성 + AI 업스케일로 2K 가능<br/>
                                    • <strong>FLUX Pro Ultra</strong>: 네이티브 2K, 최고 품질<br/>
                                    <br/>
                                    <strong>📈 자동 업스케일:</strong><br/>
                                    FLUX Schnell과 Nano Banana는 2K 선택 시 Real-ESRGAN으로 자동 업스케일됩니다!
                                </div>
                            </div>

                        </div>

                        {/* Right Panel */}
                        <div className="panel">
                            <h2 className="panel-title">생성 결과</h2>
                            
                            <div className="result-panel">
                                {loading && (
                                    <div style={{ textAlign: 'center' }}>
                                        <div className="loading-spinner"></div>
                                        <p style={{ color: '#94a3b8' }}>
                                            {referenceImage && '📷 참조 이미지 기반으로 '}
                                            {model === 'flux-schnell' && !referenceImage && resolution === '1024x1024' && 'FLUX Schnell로 빠르게 1K 이미지를 생성하고 배경을 제거하고 있습니다...'}
                                            {model === 'flux-schnell' && !referenceImage && resolution !== '1024x1024' && `FLUX Schnell로 1K 이미지 생성 → ${resolution}로 업스케일 → 배경 제거 중...`}
                                            {model === 'flux-schnell' && referenceImage && 'FLUX Dev (img2img)로 참조 이미지와 비슷한 이미지를 생성하고 배경을 제거하고 있습니다...'}
                                            {model === 'nano-banana' && !referenceImage && resolution === '1024x1024' && 'Google Nano Banana로 1K 이미지를 생성하고 배경을 제거하고 있습니다...'}
                                            {model === 'nano-banana' && !referenceImage && resolution !== '1024x1024' && `Nano Banana로 1K 이미지 생성 → ${resolution}로 업스케일 → 배경 제거 중...`}
                                            {model === 'nano-banana' && referenceImage && 'FLUX Dev (img2img)로 참조 이미지와 비슷한 이미지를 생성하고 배경을 제거하고 있습니다...'}
                                            {model === 'flux-pro-ultra' && !referenceImage && 'FLUX Pro Ultra로 최고급 고해상도 이미지를 생성하고 배경을 제거하고 있습니다...'}
                                            {model === 'flux-pro-ultra' && referenceImage && 'FLUX 1.1 Pro (img2img)로 참조 이미지와 비슷한 고품질 이미지를 생성하고 배경을 제거하고 있습니다...'}
                                        </p>
                                        <p style={{ fontSize: '12px', color: '#64748b', marginTop: '8px' }}>
                                            {referenceImage && '참조 이미지 모드: 약 15-30초 추가 소요'}
                                            {!referenceImage && model === 'flux-schnell' && resolution === '1024x1024' && '약 5-15초 소요'}
                                            {!referenceImage && model === 'flux-schnell' && resolution !== '1024x1024' && `생성 5-10초 + 업스케일 10-15초 = 약 15-25초`}
                                            {!referenceImage && model === 'nano-banana' && resolution === '1024x1024' && '약 8-18초 소요'}
                                            {!referenceImage && model === 'nano-banana' && resolution !== '1024x1024' && `생성 8-15초 + 업스케일 10-15초 = 약 18-30초`}
                                            {!referenceImage && model === 'flux-pro-ultra' && '약 20-40초 소요'}
                                        </p>
                                    </div>
                                )}

                                {error && !loading && (
                                    <div className="error-message">
                                        ❌ {error}
                                    </div>
                                )}

                                {generatedImage && !loading && (
                                    <div style={{ width: '100%', textAlign: 'center' }}>
                                        <img 
                                            src={generatedImage} 
                                            alt="Generated" 
                                            className="result-image"
                                        />
                                        <div className={`transparency-badge ${hasTransparency ? 'yes' : 'no'}`}>
                                            {hasTransparency ? '✅ 투명 배경 적용됨' : '⚠️ 배경 제거 대기 중'}
                                        </div>
                                        {warning && (
                                            <div className="warning-message">
                                                💡 {warning}
                                            </div>
                                        )}
                                        <button 
                                            className="btn-primary" 
                                            onClick={downloadImage}
                                            style={{ marginTop: '20px', width: '100%' }}
                                        >
                                            💾 투명 PNG 다운로드 ({resolution})
                                        </button>
                                        {originalImage && (
                                            <button 
                                                className="btn-secondary" 
                                                onClick={downloadOriginalImage}
                                                style={{ marginTop: '12px', width: '100%', background: '#1a1f2e', border: '1px solid rgba(0, 212, 255, 0.3)' }}
                                            >
                                                📷 배경 포함 원본 다운로드 ({resolution})
                                            </button>
                                        )}
                                    </div>
                                )}

                                {!loading && !error && !generatedImage && (
                                    <div style={{ textAlign: 'center', color: '#64748b' }}>
                                        <div style={{ fontSize: '48px', marginBottom: '16px' }}>🎨</div>
                                        <p>왼쪽에서 각도와 해상도를 선택하고<br/>오브젝트 이름을 입력한 후<br/>생성 버튼을 눌러주세요</p>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<PixelSquidGenerator />, document.getElementById('root'));
    </script>
</body>
</html>
